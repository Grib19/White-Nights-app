<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СОП "Белые Ночи"</title>
    <style>
      body { margin: 0; background: #022342; color: #ffffff; font-family: Arial, Helvetica, sans-serif; }
      /* Плавная смена цвета вкладок меню при наведении */
      .nav-tab { transition: background-color 0.25s ease, color 0.25s ease; }
      .nav-tab svg { transition: stroke 0.25s ease; }
      .nav-tab:hover:not(:disabled) { background: #FFEAAB !important; color: #022342 !important; }
      .nav-tab:hover:not(:disabled) svg { stroke: #022342; }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
